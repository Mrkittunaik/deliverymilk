<!DOCTYPE html>
<html lang="en">
<head>

<title>Delivery History</title>
<link rel="stylesheet" href="../css/delivery-base.css">

</head>
<body>
<div id="app">
  <div class="content">

    <div class="date-filter-row">

      <span class="muted" style="font-size:12px;">to</span>
      <input type="date" id="to-date" class="date-input">
      <button class="btn-sm btn btn-outline" id="filter-btn" style="width:auto;">Filter</button>
    </div>

    <div id="history-list"></div>
  </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Delivery Partner</title>
<meta http-equiv="refresh" content="0; url=pages/login.html">
<style>
  html,body{margin:0;height:100%;background:#FFFDF6;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}
</style>
<script>
  // Route straight past login.html if we already have a session.
  (function () {
    var token = localStorage.getItem("db_token");
    var status = localStorage.getItem("db_status");
    var target = "pages/login.html";
    if (token) {
      if (status === "blocked") target = "pages/blocked.html";
      else if (status === "pending") target = "pages/pending-approval.html";
      else target = "pages/home.html";
    }
    window.location.replace(target);
  })();
</script>
</head>
<body>
  <noscript>
    <p>Please enable JavaScript, or <a href="pages/login.html">continue to login</a>.</p>
  </noscript>
</body>
</html>
